# Lint and format rules for the Python code (Airflow DAGs/utils, Superset config).
# Rules are listed explicitly so a ruff upgrade doesn't change them silently.
target-version = "py311"
# Our modules (utils, dags) live under airflow/ and are imported from there
# (PYTHONPATH=/opt/airflow). Without this, ruff sees the repo's airflow/ and
# superset/ folders and sorts the real airflow and superset packages as ours.
src = ["airflow"]
[lint]
select = [
    "E4", "E7", "E9",  # pycodestyle: syntax and statement errors
    "F",               # pyflakes: unused imports, undefined names
    "I",               # isort: import order
    "RUF",             # ruff's own rules (implicit Optional, ...)
    "FURB",            # refurb: simpler idioms
    "S",               # bandit: security
    "BLE",             # blind except
]
