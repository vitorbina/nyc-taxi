name: nyc_taxi
version: "1.0.0"
profile: nyc_taxi

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: target
clean-targets: ["target", "dbt_packages"]

# Models read from s3://$MINIO_BUCKET and write there too by default.
# To test without touching real data, redirect the writes:
#   dbt run --vars '{output_lake: s3://data-lake-nyc/poc}'

# Each dbt run starts with an empty in-memory DuckDB; recreate views for the
# upstream models a partial selection depends on (see macros/lake.sql).
on-run-start:
  - "{{ register_upstream_lake_models() }}"

models:
  nyc_taxi:
    # Every model is written as Parquet to MinIO (macros/lake.sql)
    +materialized: lake
