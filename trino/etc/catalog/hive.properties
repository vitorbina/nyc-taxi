connector.name=hive
hive.metastore.uri=thrift://hive-metastore:9083
fs.native-s3.enabled=true
s3.endpoint=http://minio:9000
s3.region=us-east-1
s3.aws-access-key=${ENV:MINIO_ROOT_USER}
s3.aws-secret-key=${ENV:MINIO_ROOT_PASSWORD}
s3.path-style-access=true
hive.non-managed-table-writes-enabled=true
# Spark writes timestamps in America/New_York (spark.sql.session.timeZone); read them back
# in the same zone, otherwise Trino shows UTC and every hour is shifted by 4-5h.
hive.parquet.time-zone=America/New_York
