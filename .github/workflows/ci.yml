name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The workflow only reads the code: no write access to the repository
permissions:
  contents: read

# A new push to the same branch cancels the run still going for the previous one
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Python lint and format (ruff)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      # Same ruff version as local runs (uvx ruff@0.17.3); rules in ruff.toml
      - name: ruff check
        run: pipx run ruff==0.17.3 check airflow superset
      - name: ruff format --check
        run: pipx run ruff==0.17.3 format airflow superset --check

  stack:
    name: Compose, images, DAGs and dbt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      # The real .env never leaves the machine; the example has every variable
      - name: Create .env from the example
        run: cp .env.example .env
      - name: docker compose config
        run: docker compose config --quiet
      - name: Build the images
        run: docker compose build
      - name: DAGs import and dbt parses
        run: |
          docker run --rm --network none \
            -v "$PWD/airflow/dags:/opt/airflow/dags:ro" \
            -v "$PWD/airflow/utils:/opt/airflow/utils:ro" \
            -v "$PWD/airflow/staging:/opt/airflow/staging:ro" \
            -v "$PWD/dbt:/opt/airflow/dbt:ro" \
            -v "$PWD/scripts/ci:/ci:ro" \
            --entrypoint bash nyc-taxi-airflow-scheduler \
            /ci/check_airflow.sh

  # CD: after both checks pass on main, ask the Dokploy API to deploy the compose service.
  # Dokploy's Autodeploy stays OFF, so only a green CI deploys (its webhook URL only
  # works with Autodeploy ON, which would also deploy every push without waiting for CI).
  deploy:
    name: Deploy (Dokploy API)
    needs: [lint, stack]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Trigger the Dokploy deploy
        env:
          DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
          COMPOSE_ID: ${{ vars.DOKPLOY_COMPOSE_ID }}
          API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
        run: |
          if [ -z "$API_KEY" ]; then
            echo "::notice::DOKPLOY_API_KEY not set; skipping deploy"
            exit 0
          fi
          # --fail-with-body: a 4xx/5xx fails the job and still prints Dokploy's message
          curl --fail-with-body --silent --show-error -X POST "$DOKPLOY_URL/api/compose.deploy" \
            -H "Content-Type: application/json" \
            -H "x-api-key: $API_KEY" \
            -d "{\"composeId\": \"$COMPOSE_ID\"}"
