# Infrastructure definition for the NYC Taxi Data Lake
# Provisions: MinIO, Postgres, Airflow (webserver + scheduler, runs dbt + DuckDB), Hive Metastore, Trino, Superset

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: dockerfile/Dockerfile.airflow
  user: "${AIRFLOW_UID:-50000}:0"
  # The code (dags, utils, staging, dbt) is built into the image (Dockerfile.airflow).
  # Bind mounts broke on the server: Dokploy re-clones the repo on every deploy and
  # containers that weren't recreated kept pointing at the deleted folder (no DAGs).
  # Local development binds the folders back in docker-compose.override.yml.
  # Only logs and state (passwords file, DuckDB spill) live in volumes.
  volumes:
    - airflow_logs:/opt/airflow/logs
    - airflow_state:/opt/airflow/state
  depends_on:
    postgres:
      condition: service_healthy
  networks:
    - nyc-network
  environment:
    # One airflow.cfg for every Airflow container, on the shared state volume. Airflow
    # generates it on first start (airflow-init runs first) with random secrets: the
    # JWT secret that signs task tokens and the Fernet key that encrypts Variables.
    # Each container generating its own made the API reject the scheduler's tokens,
    # so tasks failed before writing a log line.
    AIRFLOW_CONFIG: /opt/airflow/state/airflow.cfg
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    # Cosmos renders the dbt DAGs with `dbt ls`, one call per task group, and every task
    # re-imports its DAG file when it starts. On the server, under load, taxi_staging
    # took over the 30 s default and its tasks failed with "DagBag import timeout".
    AIRFLOW__CORE__DAGBAG_IMPORT_TIMEOUT: "120"
    AIRFLOW__DAG_PROCESSOR__DAG_FILE_PROCESSOR_TIMEOUT: "180"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_AIRFLOW_USER}:${POSTGRES_AIRFLOW_PASSWORD}@postgres:5432/${POSTGRES_AIRFLOW_DB}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
    # Access personas (scripts/create_personas.sh). Roles: viewer < user < op < admin.
    # data_engineer runs DAGs and backfills and manages pools/connections (op), but
    # can't manage users. The analyst persona has no Airflow user at all.
    # Passwords are generated on first start, into the state volume.
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "admin:admin,data_engineer:op"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/state/simple_auth_manager_passwords.json.generated
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-webserver:8080/execution"
    MINIO_ENDPOINT: http://minio:9000
    MINIO_ROOT_USER: ${MINIO_ROOT_USER}
    MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    MINIO_BUCKET: ${MINIO_BUCKET}
    TRINO_HOST: trino
    # dbt tasks run inside the scheduler (LocalExecutor, 4g). Models are built one month
    # at a time (dbt/macros/lake.sql), so DuckDB's memory doesn't grow with the history;
    # what drives it is threads, each holding its own write buffers. Measured on the
    # largest month of stg_high_volume_fhv: 16 threads fail even at 1.5GB, 4 threads run
    # in 1GB (~26s, process peak ~1.6GB). Beyond the limit, DuckDB spills to disk.
    DUCKDB_MEMORY_LIMIT: 1500MB
    DUCKDB_THREADS: "4"
    # Spill on the state volume rather than the container's overlay filesystem
    DUCKDB_TEMP_DIR: /opt/airflow/state/duckdb_spill
    PYTHONPATH: /opt/airflow
    _PIP_ADDITIONAL_REQUIREMENTS: ""

services:

  # ── MinIO ──────────────────────────────────────────────────────────────────
  minio:
    # MinIO no longer publishes community images (minio/minio is gone from Docker Hub);
    # pgsty/minio is a community build of the same source (github.com/pgsty/minio)
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: nyc_minio
    # Published on localhost only: no service is reachable from other machines on the network
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    # Lake data. Default: the minio_data named volume, which lives outside the code folder,
    # so redeploys (Dokploy re-clones the repo) keep it. A local machine can point it at
    # a folder instead with MINIO_DATA in .env (e.g. MINIO_DATA=./setup/lake_data).
    volumes:
      - ${MINIO_DATA:-minio_data}:/data
    command: server /data --console-address ":9001"
    deploy:
      resources:
        limits:
          memory: 1536m
    networks:
      - nyc-network

  # ── MinIO Init (runs once: creates the lake bucket if it doesn't exist) ────
  minio-init:
    # Same image: it ships the mc client
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: nyc_minio_init
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
    entrypoint: >-
      sh -c
      'until mc alias set lake http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null 2>&1;
      do echo "waiting for minio"; sleep 2; done;
      mc mb --ignore-existing "lake/$$MINIO_BUCKET"'
    depends_on:
      - minio
    restart: "no"
    networks:
      - nyc-network

  # ── Postgres (Hive Metastore metadata) ───────────────────────────────────
  postgres-hive:
    image: postgres:18.6
    container_name: nyc_postgres_hive
    environment:
      POSTGRES_USER: ${POSTGRES_HIVE_USER}
      POSTGRES_PASSWORD: ${POSTGRES_HIVE_PASSWORD}
      POSTGRES_DB: ${POSTGRES_HIVE_DB}
    volumes:
      - postgres_hive_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_HIVE_USER}"]
      interval: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256m
    networks:
      - nyc-network

  # ── Postgres (Airflow metadata) ────────────────────────────────────────────
  postgres:
    image: postgres:18.6
    container_name: nyc_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_AIRFLOW_USER}
      POSTGRES_PASSWORD: ${POSTGRES_AIRFLOW_PASSWORD}
      POSTGRES_DB: ${POSTGRES_AIRFLOW_DB}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_AIRFLOW_USER}"]
      interval: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m
    networks:
      - nyc-network

  # ── Postgres (Superset metadata) ───────────────────────────────────────────
  postgres-superset:
    image: postgres:18.6
    container_name: nyc_postgres_superset
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERSET_USER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERSET_PASSWORD}
      POSTGRES_DB: ${POSTGRES_SUPERSET_DB}
    volumes:
      - postgres_superset_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_SUPERSET_USER}"]
      interval: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256m
    networks:
      - nyc-network

  # ── Airflow Init (runs once to create tables and admin user) ─────
  airflow-init:
    <<: *airflow-common
    container_name: nyc_airflow_init
    # The duckdb pool has one slot: dbt tasks from every DAG run one at a time
    command: >-
      bash -c
      "airflow db migrate &&
      airflow pools set duckdb 1 'dbt + DuckDB jobs, one at a time'"
    restart: "no"

  # ── Airflow Webserver ──────────────────────────────────────────────────────
  airflow-webserver:
    <<: *airflow-common
    container_name: nyc_airflow_webserver
    command: airflow api-server
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m

  # ── Airflow DAG Processor ─────────────────────────────────────────────────
  airflow-dag-processor:
    <<: *airflow-common
    container_name: nyc_airflow_dag_processor
    command: airflow dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g

  # ── Airflow Scheduler ──────────────────────────────────────────────────────
  airflow-scheduler:
    <<: *airflow-common
    container_name: nyc_airflow_scheduler
    command: airflow scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4g

  # ── Hive Metastore ────────────────────────────────────────────────────────
  hive-metastore:
    build:
      context: .
      dockerfile: dockerfile/Dockerfile.hive
    container_name: nyc_hive_metastore
    # JDBC driver and core-site.xml are built into the image (Dockerfile.hive);
    # core-site.xml reads the MinIO credentials below from the environment
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      SERVICE_OPTS: >-
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://postgres-hive:5432/${POSTGRES_HIVE_DB}
        -Djavax.jdo.option.ConnectionUserName=${POSTGRES_HIVE_USER}
        -Djavax.jdo.option.ConnectionPassword=${POSTGRES_HIVE_PASSWORD}
    # No published port: only Trino talks to the metastore, inside the Docker network
    depends_on:
      postgres-hive:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1500m
    networks:
      - nyc-network

  # ── Trino ─────────────────────────────────────────────────────────────────
  trino:
    # trinodb/trino:483 with trino/etc built in (Dockerfile.trino), not bind-mounted
    build:
      context: .
      dockerfile: dockerfile/Dockerfile.trino
    container_name: nyc_trino
    ports:
      - "127.0.0.1:8082:8080"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    depends_on:
      - hive-metastore
      - minio
    deploy:
      resources:
        limits:
          memory: 2560m
    networks:
      - nyc-network

  # ── Superset Init (migrates the DB, creates the admin user, imports dashboards) ──
  # The dashboard import makes a fresh server (Dokploy) come up with the dashboards.
  # The CLI only adds what is missing (it doesn't overwrite existing charts), so
  # changes to existing dashboards still go through scripts/import_dashboards.sh.
  # A failed import only warns: Superset without dashboards beats Superset down.
  superset-init:
    build:
      context: .
      dockerfile: dockerfile/Dockerfile.superset
    container_name: nyc_superset_init
    command: >-
      bash -c
      "superset db upgrade &&
      superset fab create-admin --username admin --firstname Admin --lastname User --email admin@localhost --password ${SUPERSET_ADMIN_PASSWORD} &&
      superset init &&
      (superset import-dashboards -p /dashboards/nyc_taxi_overview.zip -u admin
      || echo 'WARNING: dashboard import failed')"
    # superset_config.py and the dashboards zip are built into the image (Dockerfile.superset)
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      SUPERSET_DB_URI: postgresql+psycopg2://${POSTGRES_SUPERSET_USER}:${POSTGRES_SUPERSET_PASSWORD}@postgres-superset:5432/${POSTGRES_SUPERSET_DB}
    depends_on:
      postgres-superset:
        condition: service_healthy
    restart: "no"
    networks:
      - nyc-network

  # ── Superset ───────────────────────────────────────────────────────────────
  superset:
    build:
      context: .
      dockerfile: dockerfile/Dockerfile.superset
    container_name: nyc_superset
    ports:
      # 8088 on the host: 3000 is taken by the Dokploy panel on the server
      - "127.0.0.1:8088:8088"
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      SUPERSET_DB_URI: postgresql+psycopg2://${POSTGRES_SUPERSET_USER}:${POSTGRES_SUPERSET_PASSWORD}@postgres-superset:5432/${POSTGRES_SUPERSET_DB}
    depends_on:
      superset-init:
        condition: service_completed_successfully
      trino:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 512m
    networks:
      - nyc-network

volumes:
  postgres_data:
  postgres_hive_data:
  postgres_superset_data:
  airflow_logs:
  airflow_state:
  minio_data:

networks:
  nyc-network:
    driver: bridge
