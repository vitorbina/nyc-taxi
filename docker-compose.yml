# Infrastructure definition for the NYC Taxi Data Lake
# Provisions: MinIO, Postgres, Airflow (webserver + scheduler), Spark (master + worker), Trino, Metabase

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile.airflow
  user: "${AIRFLOW_UID:-50000}:0"
  volumes:
    - airflow_home:/opt/airflow
    - ./dags:/opt/airflow/dags
    - ./utils:/opt/airflow/utils
    - ./staging:/opt/airflow/staging
    - ./final:/opt/airflow/final
    - ./logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy
  networks:
    - nyc-network
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_AIRFLOW_USER}:${POSTGRES_AIRFLOW_PASSWORD}@postgres:5432/${POSTGRES_AIRFLOW_DB}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-webserver:8080/execution"
    MINIO_ENDPOINT: http://minio:9000
    MINIO_ROOT_USER: ${MINIO_ROOT_USER}
    MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    MINIO_BUCKET: ${MINIO_BUCKET}
    SPARK_MASTER_URL: spark://spark-master:7077
    HIVE_METASTORE_URI: thrift://hive-metastore:9083
    PYTHONPATH: /opt/airflow
    _PIP_ADDITIONAL_REQUIREMENTS: ""
    AIRFLOW__CORE__PARALLELISM: "2"
    AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "2"

services:

  # ── MinIO ──────────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: minio_lake
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./setup/lake_data:/data
    command: server /data --console-address ":9001"
    networks:
      - nyc-network

  # ── Postgres (Hive Metastore metadata) ───────────────────────────────────
  postgres-hive:
    image: postgres:latest
    container_name: nyc_postgres_hive
    environment:
      POSTGRES_USER: ${POSTGRES_HIVE_USER}
      POSTGRES_PASSWORD: ${POSTGRES_HIVE_PASSWORD}
      POSTGRES_DB: ${POSTGRES_HIVE_DB}
    volumes:
      - postgres_hive_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_HIVE_USER}"]
      interval: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m
    networks:
      - nyc-network

  # ── Postgres (Airflow metadata) ────────────────────────────────────────────
  postgres:
    image: postgres:latest
    container_name: nyc_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_AIRFLOW_USER}
      POSTGRES_PASSWORD: ${POSTGRES_AIRFLOW_PASSWORD}
      POSTGRES_DB: ${POSTGRES_AIRFLOW_DB}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_AIRFLOW_USER}"]
      interval: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m
    networks:
      - nyc-network

  # ── Postgres (Metabase metadata) ───────────────────────────────────────────
  postgres-metabase:
    image: postgres:latest
    container_name: nyc_postgres_metabase
    environment:
      POSTGRES_USER: ${POSTGRES_METABASE_USER}
      POSTGRES_PASSWORD: ${POSTGRES_METABASE_PASSWORD}
      POSTGRES_DB: ${POSTGRES_METABASE_DB}
    volumes:
      - postgres_metabase_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_METABASE_USER}"]
      interval: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m
    networks:
      - nyc-network

  # ── Airflow Init (runs once to create tables and admin user) ─────
  airflow-init:
    <<: *airflow-common
    container_name: nyc_airflow_init
    command: airflow db migrate
    restart: "no"

  # ── Airflow Webserver ──────────────────────────────────────────────────────
  airflow-webserver:
    <<: *airflow-common
    container_name: nyc_airflow_webserver
    command: airflow api-server
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # ── Airflow DAG Processor ─────────────────────────────────────────────────
  airflow-dag-processor:
    <<: *airflow-common
    container_name: nyc_airflow_dag_processor
    command: airflow dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # ── Airflow Scheduler ──────────────────────────────────────────────────────
  airflow-scheduler:
    <<: *airflow-common
    container_name: nyc_airflow_scheduler
    command: airflow scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 6g

  # ── Hive Metastore ────────────────────────────────────────────────────────
  hive-metastore:
    build:
      context: .
      dockerfile: Dockerfile.hive
    container_name: nyc_hive_metastore
    volumes:
      - ./setup/hive-lib/postgresql.jar:/opt/hive/lib/postgresql.jar
      - ./setup/hive-conf/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      SERVICE_OPTS: >-
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://postgres-hive:5432/${POSTGRES_HIVE_DB}
        -Djavax.jdo.option.ConnectionUserName=${POSTGRES_HIVE_USER}
        -Djavax.jdo.option.ConnectionPassword=${POSTGRES_HIVE_PASSWORD}
    ports:
      - "9083:9083"
    depends_on:
      postgres-hive:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512m
    networks:
      - nyc-network

  # ── Spark Master ───────────────────────────────────────────────────────────
  spark-master:
    build:
      context: .
      dockerfile: Dockerfile.spark
    container_name: nyc_spark_master
    entrypoint: /opt/spark/bin/spark-class
    command: org.apache.spark.deploy.master.Master
    environment:
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_PORT: "7077"
      SPARK_MASTER_WEBUI_PORT: "8080"
    ports:
      - "8081:8080"   # Spark Master UI
      - "7077:7077"   # Spark Master port
    deploy:
      resources:
        limits:
          memory: 512m
    networks:
      - nyc-network

  # ── Spark Worker ───────────────────────────────────────────────────────────
  spark-worker:
    build:
      context: .
      dockerfile: Dockerfile.spark
    container_name: nyc_spark_worker
    entrypoint: /opt/spark/bin/spark-class
    command: org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      SPARK_WORKER_MEMORY: 3g
      SPARK_WORKER_CORES: "2"
    depends_on:
      - spark-master
    deploy:
      resources:
        limits:
          memory: 3500m
    networks:
      - nyc-network

  # ── Trino ─────────────────────────────────────────────────────────────────
  trino:
    image: trinodb/trino:latest
    container_name: nyc_trino
    ports:
      - "8082:8080"
    volumes:
      - ./trino/etc:/etc/trino
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    depends_on:
      - hive-metastore
      - minio
    deploy:
      resources:
        limits:
          memory: 2g
    networks:
      - nyc-network

  # ── Metabase ───────────────────────────────────────────────────────────────
  metabase:
    image: metabase/metabase:latest
    container_name: nyc_metabase
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: postgres-metabase
      MB_DB_PORT: 5432
      MB_DB_DBNAME: ${POSTGRES_METABASE_DB}
      MB_DB_USER: ${POSTGRES_METABASE_USER}
      MB_DB_PASS: ${POSTGRES_METABASE_PASSWORD}
    depends_on:
      postgres-metabase:
        condition: service_healthy
      trino:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 1g
    networks:
      - nyc-network

volumes:
  postgres_data:
  postgres_hive_data:
  postgres_metabase_data:
  airflow_home:

networks:
  nyc-network:
    driver: bridge
