# Infrastructure definition for the NYC Taxi Data Lake
# Provisions: MinIO, Postgres, Airflow (webserver + scheduler, runs dbt + DuckDB), Hive Metastore, Trino, Superset

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: dockerfile/Dockerfile.airflow
  user: "${AIRFLOW_UID:-50000}:0"
  volumes:
    - airflow_home:/opt/airflow
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/utils:/opt/airflow/utils
    - ./airflow/staging:/opt/airflow/staging
    - ./dbt:/opt/airflow/dbt
    - ./logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy
  networks:
    - nyc-network
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_AIRFLOW_USER}:${POSTGRES_AIRFLOW_PASSWORD}@postgres:5432/${POSTGRES_AIRFLOW_DB}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-webserver:8080/execution"
    MINIO_ENDPOINT: http://minio:9000
    MINIO_ROOT_USER: ${MINIO_ROOT_USER}
    MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    MINIO_BUCKET: ${MINIO_BUCKET}
    TRINO_HOST: trino
    # dbt tasks run inside the scheduler (LocalExecutor, 4g). Models are built one month
    # at a time (dbt/macros/lake.sql), so DuckDB's memory doesn't grow with the history;
    # what drives it is threads, each holding its own write buffers. Measured on the
    # largest month of stg_high_volume_fhv: 16 threads fail even at 1.5GB, 4 threads run
    # in 1GB (~26s, process peak ~1.6GB). Beyond the limit, DuckDB spills to disk.
    DUCKDB_MEMORY_LIMIT: 1500MB
    DUCKDB_THREADS: "4"
    # Spill on the airflow_home volume rather than the container's overlay filesystem
    DUCKDB_TEMP_DIR: /opt/airflow/duckdb_spill
    PYTHONPATH: /opt/airflow
    _PIP_ADDITIONAL_REQUIREMENTS: ""

services:

  # ── MinIO ──────────────────────────────────────────────────────────────────
  minio:
    # MinIO no longer publishes community images (minio/minio is gone from Docker Hub);
    # pgsty/minio is a community build of the same source (github.com/pgsty/minio)
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: nyc_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./setup/lake_data:/data
    command: server /data --console-address ":9001"
    deploy:
      resources:
        limits:
          memory: 1g
    networks:
      - nyc-network

  # ── Postgres (Hive Metastore metadata) ───────────────────────────────────
  postgres-hive:
    image: postgres:18.6
    container_name: nyc_postgres_hive
    environment:
      POSTGRES_USER: ${POSTGRES_HIVE_USER}
      POSTGRES_PASSWORD: ${POSTGRES_HIVE_PASSWORD}
      POSTGRES_DB: ${POSTGRES_HIVE_DB}
    volumes:
      - postgres_hive_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_HIVE_USER}"]
      interval: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1500m
    networks:
      - nyc-network

  # ── Postgres (Airflow metadata) ────────────────────────────────────────────
  postgres:
    image: postgres:18.6
    container_name: nyc_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_AIRFLOW_USER}
      POSTGRES_PASSWORD: ${POSTGRES_AIRFLOW_PASSWORD}
      POSTGRES_DB: ${POSTGRES_AIRFLOW_DB}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_AIRFLOW_USER}"]
      interval: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m
    networks:
      - nyc-network

  # ── Postgres (Superset metadata) ───────────────────────────────────────────
  postgres-superset:
    image: postgres:18.6
    container_name: nyc_postgres_superset
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERSET_USER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERSET_PASSWORD}
      POSTGRES_DB: ${POSTGRES_SUPERSET_DB}
    volumes:
      - postgres_superset_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_SUPERSET_USER}"]
      interval: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m
    networks:
      - nyc-network

  # ── Airflow Init (runs once to create tables and admin user) ─────
  airflow-init:
    <<: *airflow-common
    container_name: nyc_airflow_init
    # The duckdb pool has one slot: dbt tasks from every DAG run one at a time
    command: >-
      bash -c
      "airflow db migrate &&
      airflow pools set duckdb 1 'dbt + DuckDB jobs, one at a time'"
    restart: "no"

  # ── Airflow Webserver ──────────────────────────────────────────────────────
  airflow-webserver:
    <<: *airflow-common
    container_name: nyc_airflow_webserver
    command: airflow api-server
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g

  # ── Airflow DAG Processor ─────────────────────────────────────────────────
  airflow-dag-processor:
    <<: *airflow-common
    container_name: nyc_airflow_dag_processor
    command: airflow dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1g

  # ── Airflow Scheduler ──────────────────────────────────────────────────────
  airflow-scheduler:
    <<: *airflow-common
    container_name: nyc_airflow_scheduler
    command: airflow scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4g

  # ── Hive Metastore ────────────────────────────────────────────────────────
  hive-metastore:
    build:
      context: .
      dockerfile: dockerfile/Dockerfile.hive
    container_name: nyc_hive_metastore
    volumes:
      - ./setup/hive-lib/postgresql.jar:/opt/hive/lib/postgresql.jar
      - ./setup/hive-conf/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      SERVICE_OPTS: >-
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://postgres-hive:5432/${POSTGRES_HIVE_DB}
        -Djavax.jdo.option.ConnectionUserName=${POSTGRES_HIVE_USER}
        -Djavax.jdo.option.ConnectionPassword=${POSTGRES_HIVE_PASSWORD}
    ports:
      - "9083:9083"
    depends_on:
      postgres-hive:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2500m
    networks:
      - nyc-network

  # ── Trino ─────────────────────────────────────────────────────────────────
  trino:
    image: trinodb/trino:483
    container_name: nyc_trino
    ports:
      - "8082:8080"
    volumes:
      - ./trino/etc:/etc/trino
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    depends_on:
      - hive-metastore
      - minio
    deploy:
      resources:
        limits:
          memory: 2g
    networks:
      - nyc-network

  # ── Superset Init (runs once to migrate DB and create admin user) ──────────
  superset-init:
    build:
      context: .
      dockerfile: dockerfile/Dockerfile.superset
    container_name: nyc_superset_init
    command: >-
      bash -c
      "superset db upgrade &&
      superset fab create-admin --username admin --firstname Admin --lastname User --email admin@localhost --password ${SUPERSET_ADMIN_PASSWORD} &&
      superset init"
    volumes:
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      SUPERSET_DB_URI: postgresql+psycopg2://${POSTGRES_SUPERSET_USER}:${POSTGRES_SUPERSET_PASSWORD}@postgres-superset:5432/${POSTGRES_SUPERSET_DB}
    depends_on:
      postgres-superset:
        condition: service_healthy
    restart: "no"
    networks:
      - nyc-network

  # ── Superset ───────────────────────────────────────────────────────────────
  superset:
    build:
      context: .
      dockerfile: dockerfile/Dockerfile.superset
    container_name: nyc_superset
    ports:
      - "3000:8088"
    volumes:
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      SUPERSET_DB_URI: postgresql+psycopg2://${POSTGRES_SUPERSET_USER}:${POSTGRES_SUPERSET_PASSWORD}@postgres-superset:5432/${POSTGRES_SUPERSET_DB}
    depends_on:
      superset-init:
        condition: service_completed_successfully
      trino:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 1g
    networks:
      - nyc-network

volumes:
  postgres_data:
  postgres_hive_data:
  postgres_superset_data:
  airflow_home:

networks:
  nyc-network:
    driver: bridge
