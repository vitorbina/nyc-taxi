# Infrastructure definition for the NYC Taxi Data Lake
# Provisions: MinIO, Postgres, Airflow (webserver + scheduler), Spark (master + worker)

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile.airflow
  user: "${AIRFLOW_UID:-50000}:0"
  volumes:
    - airflow_home:/opt/airflow
    - ./dags:/opt/airflow/dags
    - ./utils:/opt/airflow/utils
    - ./logs:/opt/airflow/logs
    - ./airflow-plugins:/opt/airflow/plugins
    - ./requirements-docker.txt:/requirements-docker.txt
  depends_on:
    postgres:
      condition: service_healthy
  networks:
    - nyc-network
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
    AIRFLOW__WEBSERVER__SECRET_KEY: nyc-taxi-secret-key
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-webserver:8080/execution"
    MINIO_ENDPOINT: http://minio:9000
    MINIO_ROOT_USER: minioadmin
    MINIO_ROOT_PASSWORD: minioadmin
    MINIO_BUCKET: data-lake-nyc
    SPARK_MASTER_URL: spark://spark-master:7077
    HIVE_METASTORE_URI: thrift://hive-metastore:9083
    PYTHONPATH: /opt/airflow
    _PIP_ADDITIONAL_REQUIREMENTS: ""
    AIRFLOW__CORE__PARALLELISM: "2"
    AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "2"

services:

  # ── MinIO ──────────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: minio_lake
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ./lake_data:/data
    command: server /data --console-address ":9001"
    networks:
      - nyc-network

  # ── Postgres (Hive Metastore metadata) ───────────────────────────────────
  postgres-hive:
    image: postgres:15
    container_name: nyc_postgres_hive
    environment:
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive
      POSTGRES_DB: hive_metastore
    volumes:
      - postgres_hive_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "hive"]
      interval: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m
    networks:
      - nyc-network

  # ── Postgres (Airflow metadata) ────────────────────────────────────────────
  postgres:
    image: postgres:15
    container_name: nyc_postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m
    networks:
      - nyc-network

  # ── Airflow Init (roda uma vez pra criar as tabelas e o usuário admin) ─────
  airflow-init:
    <<: *airflow-common
    container_name: nyc_airflow_init
    command: airflow db migrate
    restart: "no"

  # ── Airflow Webserver ──────────────────────────────────────────────────────
  airflow-webserver:
    <<: *airflow-common
    container_name: nyc_airflow_webserver
    command: airflow api-server
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # ── Airflow DAG Processor ─────────────────────────────────────────────────
  airflow-dag-processor:
    <<: *airflow-common
    container_name: nyc_airflow_dag_processor
    command: airflow dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # ── Airflow Scheduler ──────────────────────────────────────────────────────
  airflow-scheduler:
    <<: *airflow-common
    container_name: nyc_airflow_scheduler
    command: airflow scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 6g

  # ── Hive Metastore ────────────────────────────────────────────────────────
  hive-metastore:
    build:
      context: .
      dockerfile: Dockerfile.hive
    container_name: nyc_hive_metastore
    volumes:
      - ./hive-lib/postgresql.jar:/opt/hive/lib/postgresql.jar
      - ./hive-conf/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      SERVICE_OPTS: >-
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://postgres-hive:5432/hive_metastore
        -Djavax.jdo.option.ConnectionUserName=hive
        -Djavax.jdo.option.ConnectionPassword=hive
    ports:
      - "9083:9083"
    depends_on:
      postgres-hive:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512m
    networks:
      - nyc-network

  # ── Spark Master ───────────────────────────────────────────────────────────
  spark-master:
    image: apache/spark:3.5.3
    container_name: nyc_spark_master
    entrypoint: /opt/spark/bin/spark-class
    command: org.apache.spark.deploy.master.Master
    environment:
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_PORT: "7077"
      SPARK_MASTER_WEBUI_PORT: "8080"
    ports:
      - "8081:8080"   # Spark Master UI
      - "7077:7077"   # Spark Master port
    deploy:
      resources:
        limits:
          memory: 512m
    networks:
      - nyc-network

  # ── Spark Worker ───────────────────────────────────────────────────────────
  spark-worker:
    image: apache/spark:3.5.3
    container_name: nyc_spark_worker
    entrypoint: /opt/spark/bin/spark-class
    command: org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      SPARK_WORKER_MEMORY: 3g
      SPARK_WORKER_CORES: "2"
    depends_on:
      - spark-master
    deploy:
      resources:
        limits:
          memory: 3500m
    networks:
      - nyc-network

volumes:
  postgres_data:
  postgres_hive_data:
  airflow_home:

networks:
  nyc-network:
    driver: bridge
