table_name: rain_intensity_daily
main_dttm_col: date
description: 'One row per day: rain-intensity band and trips vs the average dry day
  of the same weekday.'
default_endpoint: null
offset: 0
cache_timeout: null
catalog: hive
schema: final
sql: "SELECT\n    date,\n    day_type,\n    total_precipitation_mm,\n    trips,\n\
  \    CASE\n        WHEN total_precipitation_mm < 1  THEN 'Dry'\n        WHEN total_precipitation_mm\
  \ < 5  THEN chr(8203) || 'Light rain (1\u20135 mm)'\n        WHEN total_precipitation_mm\
  \ < 15 THEN chr(8203) || chr(8203) || 'Moderate rain (5\u201315 mm)'\n        ELSE\
  \ chr(8203) || chr(8203) || chr(8203) || 'Heavy rain (15+ mm)'\n    END AS rain_intensity,\n\
  \    -- that day's trips vs the average DRY day of the same weekday (baseline =\
  \ 0%)\n    trips / AVG(CASE WHEN total_precipitation_mm < 1 THEN trips END) OVER\
  \ (PARTITION BY day_of_week(date)) - 1 AS vs_dry_same_weekday\nFROM final.weather_daily"
