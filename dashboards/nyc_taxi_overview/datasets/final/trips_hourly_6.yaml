columns:
- column_name: weekday_label
  verbose_name: Weekday
  is_dttm: false
  is_active: true
  type: VARCHAR
  advanced_data_type: null
  groupby: true
  filterable: true
  expression: CASE day_of_week(pickup_hour) WHEN 1 THEN lpad('Mon', 3, chr(8203))
    WHEN 2 THEN lpad('Tue', 4, chr(8203)) WHEN 3 THEN lpad('Wed', 5, chr(8203)) WHEN
    4 THEN lpad('Thu', 6, chr(8203)) WHEN 5 THEN lpad('Fri', 7, chr(8203)) WHEN 6
    THEN lpad('Sat', 8, chr(8203)) WHEN 7 THEN lpad('Sun', 9, chr(8203)) END
  description: Day name; invisible zero-width-space prefixes keep Mon..Sun in calendar
    order when sorted alphabetically.
  python_date_format: null
  extra: null
- column_name: taxi_type_label
  verbose_name: Service
  is_dttm: false
  is_active: true
  type: VARCHAR
  advanced_data_type: null
  groupby: true
  filterable: true
  expression: CASE taxi_type WHEN 'yellow_taxi' THEN 'Yellow' WHEN 'green_taxi' THEN
    'Green' WHEN 'high_volume_fhv' THEN 'Uber/Lyft' WHEN 'app_rides' THEN 'Other for-hire'
    END
