metrics:
- metric_name: avg_speed_mph
  verbose_name: Avg speed (mph)
  metric_type: null
  expression: SUM(distance_miles) / NULLIF(SUM(duration_minutes_with_distance) / 60,
    0)
  description: null
  d3format: ',.1f'
  currency: null
  extra: null
  warning_text: null
- metric_name: revenue_per_mile
  verbose_name: Revenue per mile
  metric_type: null
  expression: SUM(revenue) / NULLIF(SUM(distance_miles), 0)
  description: null
  d3format: $,.2f
  currency: null
  extra: null
  warning_text: null
- metric_name: avg_fare
  verbose_name: Avg fare
  metric_type: null
  expression: SUM(revenue) / NULLIF(SUM(fare_trips), 0)
