  MARKDOWN-intro:
    children: []
    id: MARKDOWN-intro
    meta:
      code: "**46.9M trips \xB7 Jan 1 \u2013 Feb 28, 2025.** NYC TLC trip records\
        \ for Yellow, Green, Uber/Lyft (high-volume for-hire) and other for-hire vehicles,\
        \ joined with daily weather from Open-Meteo. Times are NYC local. Records\
        \ with impossible fares, distances or durations (~0.1%) are excluded. *Revenue\
        \ = fares incl. tips; other for-hire trips don't report fares.*"
      height: 11
      width: 12
    parents:
    - ROOT_ID
    - GRID_ID
    - ROW-intro
    type: MARKDOWN
  MARKDOWN-sec-weather:
    children: []
    id: MARKDOWN-sec-weather
    meta:
      code: '### Does the weather matter?

        Not much: rainy days did not reduce demand. Day of week explains far more
        of the variation than precipitation.'
      height: 12
      width: 12
    parents:
    - ROOT_ID
    - GRID_ID
    - ROW-sec-weather
    type: MARKDOWN
  MARKDOWN-sec-when:
    children: []
    id: MARKDOWN-sec-when
    meta:
      code: "### When do New Yorkers ride?\nDemand builds through the week \u2014\
        \ Saturdays average 33% more trips than Mondays \u2014 with 8 am and 5\u2013\
        7 pm commute peaks on weekdays and late nights on Fri/Sat."
      height: 12
      width: 12
    parents:
    - ROOT_ID
    - GRID_ID
    - ROW-sec-when
    type: MARKDOWN
  MARKDOWN-sec-where:
    children: []
    id: MARKDOWN-sec-where
    meta:
      code: "### Where is the money?\nRevenue concentrates in Manhattan and at the\
        \ airports \u2014 JFK and LaGuardia lead every other zone in the city."
      height: 12
      width: 12
    parents:
    - ROOT_ID
    - GRID_ID
    - ROW-sec-where
    type: MARKDOWN
  MARKDOWN-sec-who:
    children: []
    id: MARKDOWN-sec-who
    meta:
      code: '### Who carries the city?

        Uber/Lyft carry 85% of trips; yellow cabs still earn the most per mile.'
      height: 12
      width: 12
    parents:
    - ROOT_ID
    - GRID_ID
    - ROW-sec-who
    type: MARKDOWN
